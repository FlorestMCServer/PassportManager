name: PassportManager
version: '2.0'
main: ru.florestdev.passportManager.PassportManager
api-version: '1.21'
prefix: PassportManager
load: STARTUP
authors: [ FlorestDev ]
description: Private FlorestMC's plugin on countries' passports.
softdepend: [MarriageMaster]

commands:
  passport:
    description: Основная команда управления паспортами.
    usage: /<command> [request|accept|give|get|reload|list]
    aliases: [pass, psp]

permissions:
  passport.admin:
    description: Позволяет выдавать паспорта принудительно, смотреть чужие паспорта и перезагружать конфиг.
    default: op
  passport.user:
    description: Базовое разрешение на использование команд запроса и получения своих паспортов.
    default: true

folia-supported: true